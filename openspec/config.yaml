# =============================================================================
# OpenSpec Configuration - Market Intelligence Agent
# =============================================================================

schema: spec-driven

context: |
  Tech stack: Python 3.11+, Streamlit, LangChain, ChromaDB, Polars
  UI: Streamlit with glassmorphism CSS
  Architecture: Clean Architecture (agents, config, data_engine, ml_models, ui, utils)
  ML: Scikit-learn, XGBoost, TensorFlow
  Data sources: yfinance, Alpha Vantage, Polygon.io

strict_tdd: false  # User preference - explicit in existing config

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (foundation, data, ml, agents, ui)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  runner: pytest
  command: pytest
  layers:
    unit: AVAILABLE (18 test files)
    integration: NOT_INSTALLED (httpx mock needed)
    e2e: NOT_INSTALLED (playwright needed for Streamlit)
  coverage: AVAILABLE (pytest-cov)
  tools:
    linter: pylint
    type_checker: mypy
    formatter: black
