services:
  - type: web
    name: mia-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:create_app --host 0.0.0.0 --port $PORT --factory
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.groq.com/openai/v1
      - key: RAG_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: COINMARKETCAP_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://market-intelligence-agent.vercel.app"]'
